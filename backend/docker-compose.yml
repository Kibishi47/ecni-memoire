services:
  postgres:
    image: postgres:16-alpine
    container_name: pokemon_tcg_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pokemon_tcg_db
    ports:
      - '5432:5432'
    volumes:
      - pokemon_tcg_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d pokemon_tcg_db']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pokemon_tcg_pgdata:

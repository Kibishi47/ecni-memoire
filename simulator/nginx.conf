server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Securite headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression Gzip optimisee pour bundles JS, Web Workers et base JSON
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml;

    # Cache long terme sur les assets hashés par Vite (dont simulation.worker-*.js)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Desactivation du cache sur index.html pour rechargement immediat apres deploiement
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Endpoint de Healthcheck pour Coolify
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK";
    }

    # Fallback pour le routage SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
